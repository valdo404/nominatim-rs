[package]
name = "nominatim"
version = "0.3.5"
edition = "2021"
authors = ["Grant Handy <granthandy@proton.me>"]
repository = "https://github.com/grantshandy/nominatim-rs"
documentation = "https://docs.rs/nominatim"
description = "Bindings to the reverse geocoding API powered by openstreetmap."
keywords = ["async", "coordinates", "nominatim", "geocoding", "location"]
categories = ["api-bindings", "asynchronous"]
license = "MIT"

[features]
default = ["default-tls"]
# TLS is left to reqwest's own features. Disable the default features of this
# crate to pick the backend yourself, or to hand over a `reqwest::Client` that
# is configured elsewhere in your dependency tree.
default-tls = ["reqwest/default-tls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.13", features = ["json"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
url = "2.4"

[dev-dependencies]
tokio = { version = "1.20", features = ["full"] }
